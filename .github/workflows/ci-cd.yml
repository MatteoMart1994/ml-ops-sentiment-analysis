name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-twitter-roberta-v1

      - name: Flake8
        run: flake8 app tests

      - name: Black
        run: black --check app tests

      - name: Pytest
        run: pytest -q

  build-and-publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      owner: ${{ steps.image.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image name (GHCR requires lowercase)
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/sentiment-inference:latest
            ghcr.io/${{ steps.image.outputs.owner }}/sentiment-inference:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd-deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Publish deployment manifest
        env:
          IMAGE: ghcr.io/${{ needs.build-and-publish.outputs.owner }}/sentiment-inference:${{ github.sha }}
        run: |
          echo "Published image: $IMAGE"
          echo "Rollout target (Kubernetes or Hugging Face Space) is configured via repository secrets."
